<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow">
  <title>Redirecting...</title>

  <script>
    (function () {
      // --- cookie utils (no regex) ---
      function getCookie(name){
        var cs = ('; ' + document.cookie).split('; ' + name + '=');
        if (cs.length < 2) return null;
        return decodeURIComponent(cs.pop().split(';').shift());
      }
      function setCookie(name, value){
        var parts = [
          name + '=' + encodeURIComponent(value),
          'Max-Age=31536000',
          'Path=/',
          'SameSite=Lax'
        ];
        if (location.protocol === 'https:') parts.push('Secure');
        try { if (location.hostname.endsWith('xwaf.io')) parts.push('Domain=.xwaf.io'); } catch(e){}
        document.cookie = parts.join('; ');
      }
      function delCookie(name){
        var parts = [name + '=', 'Max-Age=0', 'Path=/'];
        if (location.protocol === 'https:') parts.push('Secure');
        try { if (location.hostname.endsWith('xwaf.io')) parts.push('Domain=.xwaf.io'); } catch(e){}
        document.cookie = parts.join('; ');
      }

      // [수정] 7개 언어 매핑 로직 추가
      function mapLang(l){
        if (!l) return 'en';
        l = l.toLowerCase();
        if (l.indexOf('ko') === 0) return 'ko'; // 한국어
        if (l.indexOf('ja') === 0) return 'ja'; // 일본어
        if (l.indexOf('lb') === 0) return 'lux'; // 룩셈부르크어 (이미지의 Lux. 대응)
        if (l.indexOf('de') === 0) return 'de'; // 독일어
        if (l.indexOf('fr') === 0) return 'fr'; // 프랑스어
        if (l.indexOf('es') === 0) return 'es'; // 스페인어
        return 'en'; // 기본값 (영어)
      }

      var path = location.pathname;

      // [수정] 언어 폴더 감지 정규식 확장 (ko|ja|en|lux|de|fr|es)
      var m = /^\/(ko|ja|en|lux|de|fr|es)(\/|$)/.exec(path);
      if (m) {
        var cur = m[1];
        if (getCookie('px_lang') !== cur) setCookie('px_lang', cur);
        try { document.documentElement.setAttribute('lang', cur); } catch(e){}
        return;
      }

      // 루트에서만 리다이렉트
      if (path === '/' || path === '/index.html') {
        var legacy = getCookie('lang');
        if (legacy && !getCookie('px_lang')) { setCookie('px_lang', mapLang(legacy)); delCookie('lang'); }

        var lang = getCookie('px_lang');
        if (!lang) {
          lang = mapLang(navigator.language || navigator.userLanguage);
          setCookie('px_lang', lang);
        }

        location.replace('/' + lang + '/index.html');
      }
    })();
  </script>

  <noscript><meta http-equiv="refresh" content="0; url=/en/"></noscript>
</head>
<body>
</body>
</html>
